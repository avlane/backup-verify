[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "backup-verify"
version = "0.3.0"
description = "Check SQL Server backup chains against RPO targets and generate verify scripts"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Avery Lane"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Database",
]
dependencies = []

[project.optional-dependencies]
sqlserver = ["pyodbc>=4.0.30"]

[tool.setuptools.packages.find]
include = ["backup_verify*"]
